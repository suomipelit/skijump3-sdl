name: Build

on: [push]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        os: ["ubuntu-latest"]

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v2

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: make install-build-deps

    - name: Build
      run: make build

    defaults:
      run:
        shell: bash
